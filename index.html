<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Explore the latest promotions at Kandy City Hotel by Earl's.">
    <meta name="theme-color" content="#0b0b0b">

    <title>Kandy City Hotel | Promotions</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         AMBIENT BACKGROUND
    =============================== -->

    <div class="noise"></div>

    <div class="ambient ambient-1"></div>
    <div class="ambient ambient-2"></div>
    <div class="ambient ambient-3"></div>

    <div class="cursor-glow"></div>


    <!-- ==============================
         HERO
    =============================== -->

    <header class="hero">

        <div class="hero-content">

            <div class="eyebrow">
                <span></span>
                EXCLUSIVE PROMOTIONS
                <span></span>
            </div>

            <h1>
                Kandy City
                <em>Hotel</em>
            </h1>

            <p class="hero-subtitle">
                Discover something special
            </p>

            <button class="explore-button" type="button">
                <span>EXPLORE PROMOTIONS</span>
                <span class="explore-arrow">↓</span>
            </button>

        </div>


        <div class="hero-bottom">

            <span>BY EARL'S</span>

            <div class="hero-line"></div>

            <span>SCROLL TO EXPLORE</span>

        </div>

    </header>



    <!-- ==============================
         PROMOTIONS
    =============================== -->

    <main>

        <section class="promotions" id="promotions">

            <!-- SECTION INTRO -->

            <div class="section-intro reveal">

                <div class="section-meta">

                    <span class="number">01</span>

                    <span class="line"></span>

                    <span class="label">
                        CURRENT PROMOTIONS
                    </span>

                </div>


                <h2>
                    Moments worth
                    <span>discovering.</span>
                </h2>

            </div>



            <!-- ==============================
                 PROMOTION GALLERY
            =============================== -->

            <div class="promotion-grid">


                <!-- PROMOTION 01 -->

                <article
                    class="promotion-card card-large reveal"
                    data-index="0"
                >

                    <div class="promotion-image">

                        <img
                            src="images/promotion-01.jpg"
                            alt="Kandy City Hotel promotion 01"
                            loading="eager"
                        >

                        <div class="image-shade"></div>

                        <div class="view-promotion">

                            <span>VIEW</span>

                            <div class="view-icon">
                                ↗
                            </div>

                        </div>

                        <div class="image-number">
                            01
                        </div>

                    </div>

                </article>



                <!-- PROMOTION 02 -->

                <article
                    class="promotion-card card-small reveal"
                    data-index="1"
                >

                    <div class="promotion-image">

                        <img
                            src="images/promotion-02.jpg"
                            alt="Kandy City Hotel promotion 02"
                            loading="lazy"
                        >

                        <div class="image-shade"></div>

                        <div class="view-promotion">

                            <span>VIEW</span>

                            <div class="view-icon">
                                ↗
                            </div>

                        </div>

                        <div class="image-number">
                            02
                        </div>

                    </div>

                </article>



                <!-- PROMOTION 03 -->

                <article
                    class="promotion-card card-small reveal"
                    data-index="2"
                >

                    <div class="promotion-image">

                        <img
                            src="images/promotion-03.jpg"
                            alt="Kandy City Hotel promotion 03"
                            loading="lazy"
                        >

                        <div class="image-shade"></div>

                        <div class="view-promotion">

                            <span>VIEW</span>

                            <div class="view-icon">
                                ↗
                            </div>

                        </div>

                        <div class="image-number">
                            03
                        </div>

                    </div>

                </article>



                <!-- PROMOTION 04 -->

                <article
                    class="promotion-card card-large reveal"
                    data-index="3"
                >

                    <div class="promotion-image">

                        <img
                            src="images/promotion-04.jpg"
                            alt="Kandy City Hotel promotion 04"
                            loading="lazy"
                        >

                        <div class="image-shade"></div>

                        <div class="view-promotion">

                            <span>VIEW</span>

                            <div class="view-icon">
                                ↗
                            </div>

                        </div>

                        <div class="image-number">
                            04
                        </div>

                    </div>

                </article>

            </div>

        </section>

    </main>



    <!-- ==============================
         FOOTER
    =============================== -->

    <footer>

        <div class="footer-main">

            <div class="footer-brand">

                <h3>
                    Kandy City
                    <em>Hotel</em>
                </h3>

                <p>
                    BY EARL'S
                </p>

            </div>

            <div class="footer-mark">
                01 — 04
            </div>

        </div>


        <div class="footer-bottom">

            <span>
                © 2026 Kandy City Hotel
            </span>

            <span>
                DISCOVER · EXPERIENCE · ENJOY
            </span>

        </div>

    </footer>



    <!-- ==============================
         FULLSCREEN VIEWER
    =============================== -->

    <div
        class="lightbox"
        aria-hidden="true"
    >

        <button
            class="lightbox-close"
            type="button"
            aria-label="Close promotion"
        >
            <span></span>
            <span></span>
        </button>


        <button
            class="lightbox-prev"
            type="button"
            aria-label="Previous promotion"
        >
            ←
        </button>


        <div class="lightbox-content">

            <img
                class="lightbox-image"
                src=""
                alt="Promotion preview"
            >

        </div>


        <button
            class="lightbox-next"
            type="button"
            aria-label="Next promotion"
        >
            →
        </button>


        <div class="lightbox-bottom">

            <div class="lightbox-counter">

                <span class="current-number">
                    01
                </span>

                <span class="counter-line"></span>

                <span class="total-number">
                    04
                </span>

            </div>

            <span class="lightbox-hint">
                ESC TO CLOSE
            </span>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
